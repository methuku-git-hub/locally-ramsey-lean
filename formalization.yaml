version: "v0.4"
project:
  name: "Upper and lower bounds for locally Ramsey graphs"
  description: >-
    Let m_n(r) be the least m for which some n-vertex graph contains both
    a clique and an independent set of order r in every set of m vertices.
    With logarithms to base two, put r = ⌈log n⌉. In 1991 Erdős asked
    whether m_n(r) ≤ ⌈(log n)^3⌉ for arbitrarily large n. We answer this
    question negatively by proving that m_n(r) > (log n)^(7/2)/(log log n)^24
    for all sufficiently large n. This improves the lower bound of Alon and
    Sudakov (2007). We also give a simple construction that improves the
    upper bound of Alon, Bucić and Sudakov (2021) from
    2^(2^((log log n)^(1/2+o(1)))) to 2^((9/2+o(1))(log log n)^2).
    Both bounds are formalized in Lean 4.
  authors: ["Abhishek Methuku"]
  responsible_maintainers: ["Abhishek Methuku"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.CO"]
  msc2020: ["05C55", "05D10"]
