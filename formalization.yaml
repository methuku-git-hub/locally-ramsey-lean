fidelity:
  divergences: >-
    The upper estimate is expressed as an eventual bound for every fixed
    positive excess over the coefficient 9/2. A graph on n vertices uses Fin n.
    The lower proof rounds the finite sampling parameters and uses
    ceil(r / (ln r)^2) as the cutoff on the number of vertices whose groups
    have many intersections. The resulting lower bound has the denominator
    and logarithm base stated in Theorem 1.
review:
  status: "agent-reviewed"
  notes: >-
    Both bounds passed local Comparator with Lean and NanoDa. The macOS
    invocation used the option to disable sandboxing. Palomar verification
    of a public commit is pending.
